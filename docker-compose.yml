services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cargo-auction-app
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5173/api
    networks:
      - cargo-auction-network

networks:
  cargo-auction-network:
    driver: bridge
