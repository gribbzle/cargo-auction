services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=https://api.example.com/api/v1
    container_name: cargo-auction
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
    networks:
      - cargo-auction-network

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cargo-auction-dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api/v1
    networks:
      - cargo-auction-network

networks:
  cargo-auction-network:
    driver: bridge

volumes:
  node_modules:
